  # ───────────────────────── Agenda ─────────────────────────
  /bloque/disponibles:
    get:
      tags: [Agenda]
      summary: Horarios disponibles de un peluquero para una fecha
      description: |
        La agenda va de 09:00 a 18:00 en bloques de 45 minutos. Devuelve los horarios de inicio
        posibles con suficientes bloques libres consecutivos para cubrir `duracionTotal`.
        Si la fecha es hoy, se omiten los horarios ya pasados.
      parameters:
        - { name: fecha, in: query, required: true, schema: { type: string, format: date }, example: '2026-10-20' }
        - { name: peluqueroId, in: query, required: true, schema: { type: integer }, example: 1 }
        - { name: duracionTotal, in: query, required: true, schema: { type: integer }, description: Minutos, example: 90 }
      responses:
        '200':
          description: Horarios posibles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BloqueHorario' } }
        '400': { description: Faltan parámetros, content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
        '500': { description: Error de servidor, content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }

  /bloque/estado-agenda:
    get:
      tags: [Agenda]
      summary: Estado de cada bloque de la agenda de un peluquero en una fecha
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      parameters:
        - { name: fecha, in: query, required: true, schema: { type: string, format: date }, example: '2026-10-20' }
        - { name: peluqueroId, in: query, required: true, schema: { type: integer }, example: 1 }
      responses:
        '200':
          description: Grilla del día
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/BloqueHorario'
                    - type: object
                      properties:
                        estado: { type: string, enum: [libre, ocupado, bloqueado] }
        '400': { description: Faltan parámetros, content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Error al procesar agenda, content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }

  /bloque/bloqueodia:
    post:
      tags: [Agenda]
      summary: Bloquear / desbloquear horarios de la agenda
      security: [{ bearerAuth: [] }]
      description: |
        Rol requerido: **peluquero**.
        Para cada horario: si está `libre` pasa a `bloqueado`, y si está `bloqueado` vuelve a `libre`.
        Si alguno de los horarios tiene un turno (`ocupado`) y no se envía `forzar: true`,
        responde 409 con los horarios en conflicto para pedir confirmación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peluqueroId, fecha, horarios]
              properties:
                peluqueroId: { type: integer, example: 1 }
                fecha: { type: string, format: date, example: '2026-10-20' }
                horarios: { type: array, items: { type: string }, example: ['09:00', '09:45'] }
                forzar: { type: boolean, example: false }
      responses:
        '200': { description: Agenda actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Mensaje' } } } }
        '400': { description: Sin horarios seleccionados, content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Hay turnos en los horarios elegidos; se requiere confirmación
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: CONFIRMACION_REQUERIDA }
                  conflictos: { type: array, items: { type: string }, example: ['09:45'] }
        '500': { description: Error al actualizar agenda, content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }

