openapi: 3.0.3
info:
  title: API Peluquería
  version: 1.0.0
  description: |
    API REST del sistema de gestión de turnos de la peluquería.

    **Autenticación:** las rutas marcadas con el candado requieren un JWT.
    Obtenerlo con `POST /persona/login` y cargarlo con el botón **Authorize**
    (solo el token, sin el prefijo `Bearer`). El token dura 2 horas.

    **Niveles de acceso:**
    - `peluquero`: administra el catálogo (servicios, productos, marcas, tonos, etc.), la agenda y las atenciones.
    - `cliente`: saca turnos y consulta sus atenciones.

    **Errores:** todas las respuestas de error tienen la forma `{ "message": "..." }`
    (algunos endpoints de agenda y atención usan `{ "error": "..." }`).
    - `401`: no se envió token.
    - `403`: token inválido/expirado, o el rol no tiene permiso.
servers:
  - url: http://localhost:3000/api
    description: Local

tags:
  - name: Auth
  - name: Clientes
  - name: Peluqueros
  - name: Servicios
  - name: Atenciones
  - name: Agenda
  - name: Atención-Servicio
  - name: Productos utilizados
  - name: Productos
  - name: Categorías
  - name: Marcas
  - name: Productos-Marcas
  - name: Tonos
  - name: Fórmulas
  - name: Vouchers

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    idPersona:
      name: idPersona
      in: path
      required: true
      schema: { type: integer }
    codServicio:
      name: codServicio
      in: path
      required: true
      schema: { type: integer }
    idProducto:
      name: idProducto
      in: path
      required: true
      schema: { type: integer }
    idAtencion:
      name: idAtencion
      in: path
      required: true
      schema: { type: integer }
    idTono:
      name: idTono
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Token no proporcionado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Token inválido/expirado o rol sin permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicto con el estado actual (duplicado o recurso en uso)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Error interno (también se devuelve cuando el recurso buscado no existe)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Ok:
      description: Operación realizada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mensaje' }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string, example: Descripción del error }
    Mensaje:
      type: object
      properties:
        message: { type: string }

    Persona:
      type: object
      properties:
        idPersona: { type: integer, example: 1 }
        dni: { type: string, example: '40123456' }
        nombre: { type: string, example: Ana }
        apellido: { type: string, example: Gómez }
        telefono: { type: string, example: '3415551234' }
        email: { type: string, example: ana@mail.com }
        type: { type: string, enum: [peluquero, cliente] }
    PersonaInput:
      type: object
      properties:
        dni: { type: string, example: '40123456' }
        clave: { type: string, example: secreta123 }
        nombre: { type: string, example: Ana }
        apellido: { type: string, example: Gómez }
        telefono: { type: string, example: '3415551234' }
        email: { type: string, example: ana@mail.com }

    Servicio:
      type: object
      properties:
        codServicio: { type: integer, example: 1 }
        nombreServicio: { type: string, example: Corte }
        descripcion: { type: string, example: Corte de pelo con lavado }
        cantTurnos: { type: integer, description: Cantidad de bloques de 45 minutos que ocupa, example: 1 }
        precio: { type: number, example: 8000 }
        activo: { type: boolean }
        requiereTono: { type: boolean, description: 'Si es true, al sacar el turno se envía al cliente un mail con indicaciones previas' }
    ServicioInput:
      type: object
      required: [nombreServicio, precio, cantTurnos]
      properties:
        nombreServicio: { type: string, example: Coloración }
        descripcion: { type: string, example: Tintura completa }
        cantTurnos: { type: integer, minimum: 1, example: 2 }
        precio: { type: number, minimum: 0, exclusiveMinimum: true, example: 25000 }
        activo: { type: boolean, example: true }
        requiereTono: { type: boolean, example: true }

    Atencion:
      type: object
      properties:
        idAtencion: { type: integer }
        cliente: { $ref: '#/components/schemas/Persona' }
        peluquero: { $ref: '#/components/schemas/Persona' }
        fecha: { type: string, format: date-time }
        horaInicio: { type: string, format: date-time }
        horaFin: { type: string, format: date-time }
        descripcion: { type: string }
        estado: { type: string, enum: [pendiente, finalizado, cancelado] }
        porcentajeDescuento: { type: integer, nullable: true, example: 10, description: Descuento aplicado al turno (null si no se aplicó) }
        atencionServicios:
          type: array
          items:
            type: object
            properties:
              idAtSer: { type: integer }
              servicio: { $ref: '#/components/schemas/Servicio' }
    AtencionResumen:
      type: object
      properties:
        idAtencion: { type: integer }
        fecha: { type: string, format: date-time }
        horaInicio: { type: string, format: date-time }
        horaFin: { type: string, format: date-time }
        estado: { type: string, enum: [pendiente, finalizado, cancelado] }
        porcentajeDescuento: { type: integer, nullable: true, example: 10, description: Descuento aplicado al turno (null si no se aplicó) }
        peluquero: { $ref: '#/components/schemas/Persona' }
        atencionServicios:
          type: array
          items:
            type: object
            properties:
              idAtSer: { type: integer }
              servicio: { $ref: '#/components/schemas/Servicio' }

    BloqueHorario:
      type: object
      properties:
        hora_inicio: { type: string, example: '09:00' }
        hora_fin: { type: string, example: '09:45' }

    Categoria:
      type: object
      properties:
        idCategoria: { type: integer, example: 1 }
        nombreCategoria: { type: string, example: Tinturas }
    Marca:
      type: object
      properties:
        idMarca: { type: integer, example: 1 }
        nombre: { type: string, example: Loreal }
    Producto:
      type: object
      properties:
        idProducto: { type: integer, example: 1 }
        descripcion: { type: string, example: Tintura 7.1 }
        activo: { type: boolean }
        categoria: { $ref: '#/components/schemas/Categoria' }
    ProdMar:
      type: object
      description: Un producto de una marca determinada
      properties:
        idPM: { type: integer, example: 1 }
        activo: { type: boolean }
        producto: { $ref: '#/components/schemas/Producto' }
        marca: { $ref: '#/components/schemas/Marca' }
    Tono:
      type: object
      properties:
        idTono: { type: integer, example: 1 }
        nombre: { type: string, example: Rubio ceniza }
        activo: { type: boolean }
    Formula:
      type: object
      description: Cantidad de un producto-marca necesaria para lograr un tono
      properties:
        idFormula: { type: integer }
        cantidad: { type: number, example: 30 }
        activo: { type: boolean }
        prodMar: { $ref: '#/components/schemas/ProdMar' }
        tono: { $ref: '#/components/schemas/Tono' }
    Descuento:
      type: object
      properties:
        idDescuento: { type: integer, example: 1 }
        porcentaje: { type: number, example: 10 }
        cantAtencionNecesaria: { type: integer, description: Se desbloquea cada vez que el cliente acumula un múltiplo de esta cantidad de atenciones finalizadas, example: 5 }
        estado: { type: boolean, description: Si el voucher está vigente }

security: []

paths:
  # ───────────────────────── Auth ─────────────────────────
  /persona/register:
    post:
      tags: [Auth]
      summary: Registrarse como cliente
      description: |
        Registro público. Siempre crea un usuario con rol `cliente`.
        Los peluqueros los da de alta otro peluquero con `POST /persona/peluquero`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido, dni, email, telefono, clave]
              properties:
                nombre: { type: string, example: Ana }
                apellido: { type: string, example: Gómez }
                dni: { type: string, example: '40123456' }
                email: { type: string, example: ana@mail.com }
                telefono: { type: string, example: '3415551234' }
                clave: { type: string, example: secreta123 }
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Usuario registrado }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      type: { type: string }
        '400': { description: 'Faltan datos o email ya registrado', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/ServerError' }

  /persona/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, clave]
              properties:
                email: { type: string, example: ana@mail.com }
                clave: { type: string, example: secreta123 }
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Login exitoso }
                  token: { type: string, description: JWT válido por 2 horas }
                  idPersona: { type: integer }
                  type: { type: string, enum: [peluquero, cliente] }
                  nombre: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Credenciales inválidas, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/ServerError' }

  /persona/{id}:
    get:
      tags: [Auth]
      summary: Obtener una persona por id
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Persona encontrada, content: { application/json: { schema: { $ref: '#/components/schemas/Persona' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── Clientes ─────────────────────────
  /persona/cliente:
    get:
      tags: [Clientes]
      summary: Listar clientes
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/Persona' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Clientes]
      summary: Crear cliente
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaInput' }
      responses:
        '201': { description: Cliente creado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /persona/cliente/{idPersona}:
    parameters:
      - $ref: '#/components/parameters/idPersona'
    get:
      tags: [Clientes]
      summary: Detalle de un cliente
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Persona' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Clientes]
      summary: Modificar cliente
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero** o **cliente**. Un cliente solo puede modificar su propio perfil (si no, 403).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaInput' }
      responses:
        '200': { description: Cliente actualizado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Clientes]
      summary: Eliminar cliente
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── Peluqueros ─────────────────────────
  /persona/peluquero/findAllPeluquero:
    get:
      tags: [Peluqueros]
      summary: Listar peluqueros
      responses:
        '200':
          description: Lista de peluqueros (array sin envoltorio)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Persona' } }
        '500': { $ref: '#/components/responses/ServerError' }

  /persona/peluquero:
    post:
      tags: [Peluqueros]
      summary: Crear peluquero
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaInput' }
      responses:
        '201': { description: Peluquero creado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /persona/peluquero/{idPersona}:
    parameters:
      - $ref: '#/components/parameters/idPersona'
    get:
      tags: [Peluqueros]
      summary: Detalle de un peluquero
      responses:
        '200':
          description: Peluquero encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Persona' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Peluqueros]
      summary: Modificar peluquero
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaInput' }
      responses:
        '200': { description: Peluquero actualizado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Peluqueros]
      summary: Eliminar peluquero
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── Servicios ─────────────────────────
  /servicio/findAll:
    get:
      tags: [Servicios]
      summary: Listar servicios activos
      responses:
        '200':
          description: Servicios activos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
        '500': { $ref: '#/components/responses/ServerError' }

  /servicio/findAllAyD:
    get:
      tags: [Servicios]
      summary: Listar todos los servicios (activos y dados de baja)
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      responses:
        '200':
          description: Todos los servicios
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /servicio/listarPorPrecio:
    get:
      tags: [Servicios]
      summary: Listar servicios activos filtrando por rango de precio
      parameters:
        - { name: min, in: query, required: false, schema: { type: number }, description: 'Precio mínimo (por defecto 0)' }
        - { name: max, in: query, required: false, schema: { type: number }, description: 'Precio máximo (por defecto sin límite)' }
      responses:
        '200':
          description: Servicios dentro del rango
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
        '500': { $ref: '#/components/responses/ServerError' }

  /servicio/findById/{codServicio}:
    get:
      tags: [Servicios]
      summary: Detalle de un servicio
      parameters:
        - $ref: '#/components/parameters/codServicio'
      responses:
        '200':
          description: Servicio encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Servicio' }
        '500': { $ref: '#/components/responses/ServerError' }

  /servicio/add:
    post:
      tags: [Servicios]
      summary: Crear servicio
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioInput' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { description: 'Falta el nombre, o el precio/cantTurnos no son mayores a 0', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Ya existe un servicio con ese nombre, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/ServerError' }

  /servicio/{codServicio}:
    put:
      tags: [Servicios]
      summary: Modificar servicio
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      parameters:
        - $ref: '#/components/parameters/codServicio'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioInput' }
      responses:
        '200': { description: Servicio actualizado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /servicio/delete/{codServicio}:
    delete:
      tags: [Servicios]
      summary: Dar de baja un servicio (baja lógica)
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**. Marca el servicio como inactivo.'
      parameters:
        - $ref: '#/components/parameters/codServicio'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── Atenciones ─────────────────────────
  /atencion/crear:
    post:
      tags: [Atenciones]
      summary: Sacar un turno (crear atención)
      security: [{ bearerAuth: [] }]
      description: |
        Rol requerido: **peluquero** o **cliente**.
        Crea la atención en estado `pendiente`, asocia los servicios y marca como ocupados
        los bloques de agenda del peluquero. Si algún servicio `requiereTono`, envía al
        cliente un mail con indicaciones previas.
        Si `aplicarDescuento` es true y el cliente tiene un descuento desbloqueado, se guarda en
        la atención el mayor porcentaje disponible (calculado en el servidor, igual que en
        `verificar-descuento`). Si el cliente no lo aplica, el descuento no se guarda para otro turno.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clienteId, peluqueroId, fecha, horaInicio, duracion, servicios]
              properties:
                clienteId: { type: integer, example: 3 }
                peluqueroId: { type: integer, example: 1 }
                fecha: { type: string, format: date, example: '2026-10-20' }
                horaInicio: { type: string, example: '09:45', description: 'HH:mm' }
                duracion: { type: integer, example: 90, description: Duración total en minutos }
                servicios: { type: array, items: { type: integer }, example: [1, 2], description: Códigos de servicio }
                aplicarDescuento: { type: boolean, example: true, description: El cliente elige usar su descuento desbloqueado en este turno }
      responses:
        '201':
          description: Atención creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  atencion: { $ref: '#/components/schemas/Atencion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Error al crear atención, content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }

  /atencion/verificar-descuento/{idPersona}:
    post:
      tags: [Atenciones]
      summary: Calcular precio y descuento aplicable para un cliente
      security: [{ bearerAuth: [] }]
      description: |
        Calcula el subtotal de los servicios elegidos y aplica el mayor voucher desbloqueado por el
        cliente. Los vouchers solo aplican si el cliente no tiene atenciones pendientes.
      parameters:
        - $ref: '#/components/parameters/idPersona'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servicios]
              properties:
