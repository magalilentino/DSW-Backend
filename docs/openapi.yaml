        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Marcas]
      summary: Eliminar marca
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**. No se permite si tiene productos asociados.'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── Productos-Marcas ─────────────────────────
  /prodMar:
    get:
      tags: [Productos-Marcas]
      summary: Listar productos-marcas
      responses:
        '200':
          description: Productos-marcas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/ProdMar' } }
        '500': { $ref: '#/components/responses/ServerError' }

  /prodMar/listarProductos:
    get:
      tags: [Productos-Marcas]
      summary: Listar productos-marcas filtrando por marca y/o categoría
      parameters:
        - { name: idMarca, in: query, required: false, schema: { type: integer } }
        - { name: idCategoria, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: Productos-marcas que cumplen el filtro
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    idPM: { type: integer }
                    producto: { type: object, properties: { descripcion: { type: string } } }
                    marca: { type: object, properties: { nombre: { type: string } } }
        '500': { $ref: '#/components/responses/ServerError' }

  /prodMar/marcasPorProd/{idProducto}:
    get:
      tags: [Productos-Marcas]
      summary: Marcas activas de un producto
      parameters:
        - $ref: '#/components/parameters/idProducto'
      responses:
        '200':
          description: Productos-marcas activos del producto
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/ProdMar' } }
        '500': { $ref: '#/components/responses/ServerError' }

  /prodMar/sincronizarProdMar/{idProducto}:
    put:
      tags: [Productos-Marcas]
      summary: Definir las marcas disponibles de un producto
      security: [{ bearerAuth: [] }]
      description: |
        Rol requerido: **peluquero**.
        Recibe la lista completa de marcas que debe tener el producto: agrega las nuevas y
        da de baja (lógica) las que ya no están.
      parameters:
        - $ref: '#/components/parameters/idProducto'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prodMarcIds]
              properties:
                prodMarcIds: { type: array, items: { type: integer }, description: ids de marca, example: [1, 3] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /prodMar/{idProducto}:
    post:
      tags: [Productos-Marcas]
      summary: Asociar marcas a un producto
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      parameters:
        - $ref: '#/components/parameters/idProducto'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marcasIds]
              properties:
                marcasIds: { type: array, items: { type: integer }, example: [1, 2] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── Tonos ─────────────────────────
  /tono:
    get:
      tags: [Tonos]
      summary: Listar tonos
      responses:
        '200':
          description: Tonos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/Tono' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Tonos]
      summary: Crear tono con su fórmula
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, formulas]
              properties:
                nombre: { type: string, example: Rubio ceniza }
                formulas:
                  type: array
                  items:
                    type: object
                    properties:
                      idPM: { type: integer, example: 1 }
                      cantidad: { type: number, example: 30 }
      responses:
        '201': { description: Tono creado con fórmulas }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Algún producto-marca (idPM) no existe, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/ServerError' }

  /tono/activos:
    get:
      tags: [Tonos]
      summary: Listar tonos activos
      responses:
        '200':
          description: Tonos activos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/Tono' } }
        '500': { $ref: '#/components/responses/ServerError' }

  /tono/tonosPorservicio/{codServicio}:
    get:
      tags: [Tonos]
      summary: Tonos (con fórmulas) para un servicio
      parameters:
        - $ref: '#/components/parameters/codServicio'
      responses:
        '200':
          description: Tonos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/Tono' } }
        '500': { $ref: '#/components/responses/ServerError' }

  /tono/{idTono}:
    parameters:
      - $ref: '#/components/parameters/idTono'
    get:
      tags: [Tonos]
      summary: Obtener un tono
      responses:
        '200':
          description: Tono encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Tono' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Tonos]
      summary: Modificar tono
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
      responses:
        '200': { description: Tono actualizado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Tonos]
      summary: Dar de baja un tono (baja lógica, también sus fórmulas)
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── Fórmulas ─────────────────────────
  /formula:
    get:
      tags: [Fórmulas]
      summary: Listar fórmulas
      responses:
        '200':
          description: Fórmulas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/Formula' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Fórmulas]
      summary: Crear fórmula
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cantidad: { type: number, example: 30 }
                prodMar: { type: integer, description: idPM, example: 1 }
                tono: { type: integer, description: idTono, example: 1 }
      responses:
        '201': { description: Fórmula creada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /formula/formulasPorTono/{idTono}:
    get:
      tags: [Fórmulas]
      summary: Fórmulas de un tono (con producto y marca)
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      parameters:
        - $ref: '#/components/parameters/idTono'
      responses:
        '200':
          description: Fórmulas del tono
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/Formula' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /formula/{idFormula}:
    parameters:
      - { name: idFormula, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Fórmulas]
      summary: Obtener una fórmula
      responses:
        '200':
          description: Fórmula encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Formula' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Fórmulas]
      summary: Modificar fórmula
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cantidad: { type: number }
                prodMar: { type: integer }
                tono: { type: integer }
      responses:
        '200': { description: Fórmula actualizada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Fórmulas]
      summary: Dar de baja una fórmula (baja lógica)
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── Vouchers ─────────────────────────
  /voucher:
    get:
      tags: [Vouchers]
      summary: Listar vouchers de descuento
      responses:
        '200':
          description: Vouchers
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/Descuento' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Vouchers]
      summary: Crear voucher
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [porcentaje, cantAtencionNecesaria, estado]
              properties:
                porcentaje: { type: number, example: 10 }
                cantAtencionNecesaria: { type: integer, example: 5 }
                estado: { type: boolean, example: true }
      responses:
        '201': { description: Voucher creado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /voucher/{idDescuento}:
    parameters:
      - { name: idDescuento, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vouchers]
      summary: Obtener un voucher
      responses:
        '200':
          description: Voucher encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Descuento' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Vouchers]
      summary: Modificar voucher
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                porcentaje: { type: number }
                cantAtencionNecesaria: { type: integer }
                estado: { type: boolean }
      responses:
        '200': { description: Voucher actualizado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Vouchers]
      summary: Eliminar voucher
      security: [{ bearerAuth: [] }]
      description: 'Rol requerido: **peluquero**'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
